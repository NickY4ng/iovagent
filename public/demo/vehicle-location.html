<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>车辆实时位置</title>
    <link rel="stylesheet" href="/demo/leaflet.css" />
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f5f6f8;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: #f5f6f8;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      ::selection {
        color: #0b2857;
        background: #cfe1ff;
      }

      .page {
        width: min(100%, 1120px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 18px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 44px;
        border-bottom: 1px solid #e2e5ea;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        font-size: 14px;
        font-weight: 650;
        color: #111827;
      }

      .brand-mark {
        display: inline-flex;
        width: 26px;
        height: 26px;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        border-radius: 7px;
        background: #172033;
        color: #ffffff;
        font-size: 12px;
        font-weight: 700;
      }

      .online {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        flex: 0 0 auto;
        font-size: 12px;
        font-weight: 600;
        color: #157347;
      }

      .online::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #22a06b;
        box-shadow: 0 0 0 3px #d9f3e7;
        content: "";
      }

      .summary {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: 20px;
        padding: 24px 0 18px;
      }

      .summary h1 {
        margin: 0;
        font-size: clamp(22px, 3vw, 32px);
        font-weight: 680;
        line-height: 1.25;
        letter-spacing: 0;
        color: #101828;
      }

      .summary p {
        max-width: 72ch;
        margin: 7px 0 0;
        font-size: 13px;
        line-height: 1.7;
        color: #5c667a;
      }

      .updated {
        text-align: right;
        white-space: nowrap;
      }

      .updated span {
        display: block;
        margin-bottom: 3px;
        font-size: 11px;
        color: #7d8799;
      }

      .updated strong {
        font-size: 13px;
        font-weight: 620;
        color: #344054;
      }

      .map-shell {
        position: relative;
        min-height: 430px;
        overflow: hidden;
        border: 1px solid #dfe3e8;
        border-radius: 8px;
        background: #e9edf2;
        box-shadow: 0 12px 30px -24px rgba(16, 24, 40, 0.55);
      }

      #map {
        position: absolute;
        inset: 0;
      }

      .map-fallback {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        color: #667085;
      }

      .map-fallback[hidden] {
        display: none;
      }

      .map-overlay {
        position: absolute;
        right: 14px;
        bottom: 14px;
        z-index: 500;
        width: min(360px, calc(100% - 28px));
        padding: 13px 14px;
        border: 1px solid rgba(220, 225, 232, 0.96);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 14px 32px -22px rgba(16, 24, 40, 0.7);
      }

      .map-overlay-label {
        margin-bottom: 5px;
        font-size: 11px;
        font-weight: 650;
        color: #5270a3;
      }

      .map-overlay-title {
        overflow-wrap: anywhere;
        font-size: 14px;
        font-weight: 650;
        line-height: 1.55;
        color: #172033;
      }

      .map-overlay-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        margin-top: 8px;
        font-size: 12px;
        color: #556176;
      }

      .details {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1px;
        margin-top: 16px;
        overflow: hidden;
        border: 1px solid #e0e4e9;
        border-radius: 8px;
        background: #e0e4e9;
      }

      .detail {
        min-width: 0;
        padding: 14px 15px;
        background: #ffffff;
      }

      .detail dt {
        margin: 0;
        font-size: 11px;
        line-height: 1.4;
        color: #7b8494;
      }

      .detail dd {
        margin: 6px 0 0;
        overflow-wrap: anywhere;
        font-size: 13px;
        font-weight: 620;
        line-height: 1.55;
        color: #273249;
      }

      .coordinate {
        margin-top: 12px;
        font-size: 11px;
        line-height: 1.6;
        color: #7b8494;
      }

      .leaflet-control-attribution {
        font-size: 9px;
      }

      .vehicle-map-icon {
        border: 0;
        background: transparent;
      }

      .vehicle-marker {
        position: relative;
        width: 42px;
        height: 42px;
      }

      .heading-arrow {
        position: absolute;
        top: -14px;
        left: 16px;
        width: 0;
        height: 0;
        border-right: 5px solid transparent;
        border-bottom: 14px solid #1d5fd1;
        border-left: 5px solid transparent;
        transform: rotate(var(--heading));
        transform-origin: 5px 35px;
        filter: drop-shadow(0 2px 2px rgba(29, 95, 209, 0.24));
      }

      .vehicle-dot {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 3px solid #ffffff;
        border-radius: 50%;
        background: #1d5fd1;
        box-shadow: 0 7px 18px rgba(16, 24, 40, 0.28);
        color: #ffffff;
        font-size: 13px;
        font-weight: 750;
      }

      .leaflet-popup-content-wrapper {
        border-radius: 8px;
        box-shadow: 0 12px 30px -18px rgba(16, 24, 40, 0.6);
      }

      .leaflet-popup-content {
        min-width: 210px;
        margin: 12px 14px;
        font-family: inherit;
        line-height: 1.55;
      }

      .popup-title {
        margin-bottom: 5px;
        font-size: 13px;
        font-weight: 700;
        color: #172033;
      }

      .popup-line {
        font-size: 12px;
        color: #5b6679;
      }

      @media (max-width: 720px) {
        .page {
          padding: 12px;
        }

        .summary {
          grid-template-columns: 1fr;
          gap: 12px;
          padding-top: 18px;
        }

        .updated {
          text-align: left;
        }

        .map-shell {
          min-height: 390px;
        }

        .details {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 430px) {
        .summary h1 {
          font-size: 22px;
        }

        .map-shell {
          min-height: 360px;
        }

        .map-overlay {
          right: 10px;
          bottom: 10px;
          width: calc(100% - 20px);
        }

        .details {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">车</span>
          <span>车辆实时位置</span>
        </div>
        <div class="online">定位正常</div>
      </header>

      <section class="summary" aria-labelledby="vehicle-title">
        <div>
          <h1 id="vehicle-title">车辆 <span id="plate">沪A12345</span></h1>
          <p id="poi-summary">G60 沪昆高速·嘉兴服务区东侧 2.4km</p>
        </div>
        <div class="updated">
          <span>最后定位时间</span>
          <strong id="last-time">2026-08-03 16:42:18</strong>
        </div>
      </section>

      <section class="map-shell" aria-label="车辆当前位置地图">
        <div id="map-fallback" class="map-fallback">正在加载真实地图底图...</div>
        <div id="map"></div>
        <div class="map-overlay">
          <div class="map-overlay-label">当前位置 POI</div>
          <div id="poi" class="map-overlay-title">G60 沪昆高速·嘉兴服务区东侧 2.4km</div>
          <div class="map-overlay-meta">
            <span>航向 <strong id="direction">正东方向（88°）</strong></span>
            <span>速度 <strong id="speed">68 km/h</strong></span>
          </div>
        </div>
      </section>

      <dl class="details">
        <div class="detail">
          <dt>车牌号</dt>
          <dd id="plate-detail">沪A12345</dd>
        </div>
        <div class="detail">
          <dt>关联运单</dt>
          <dd id="waybill">未关联运单</dd>
        </div>
        <div class="detail">
          <dt>行驶方向</dt>
          <dd id="direction-detail">正东方向（88°）</dd>
        </div>
        <div class="detail">
          <dt>当前速度</dt>
          <dd id="speed-detail">68 km/h</dd>
        </div>
      </dl>
      <div class="coordinate">定位坐标：<span id="coordinate">30.768421, 120.684295</span> · 地图数据 © OpenStreetMap contributors</div>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const read = (key, fallback) => params.get(key)?.trim() || fallback;
      const plate = read('plate', '沪A12345');
      const waybill = read('waybill', '');
      const poi = read('poi', 'G60 沪昆高速·嘉兴服务区东侧 2.4km');
      const direction = read('direction', '正东方向（88°）');
      const speed = read('speed', '68 km/h');
      const lastTime = read('time', '2026-08-03 16:42:18');
      const heading = Number.parseFloat(read('heading', '88'));
      const parsedLat = Number.parseFloat(read('lat', '30.768421'));
      const parsedLng = Number.parseFloat(read('lng', '120.684295'));
      const lat = Number.isFinite(parsedLat) && Math.abs(parsedLat) <= 90 ? parsedLat : 30.768421;
      const lng = Number.isFinite(parsedLng) && Math.abs(parsedLng) <= 180 ? parsedLng : 120.684295;
      const safeHeading = Number.isFinite(heading) ? heading : 88;

      const setText = (id, value) => {
        const element = document.getElementById(id);
        if (element) element.textContent = value;
      };

      document.title = `${plate} 车辆实时位置`;
      setText('plate', plate);
      setText('plate-detail', plate);
      setText('waybill', waybill || '未关联运单');
      setText('poi-summary', poi);
      setText('poi', poi);
      setText('direction', direction);
      setText('direction-detail', direction);
      setText('speed', speed);
      setText('speed-detail', speed);
      setText('last-time', lastTime);
      setText('coordinate', `${lat.toFixed(6)}, ${lng.toFixed(6)}`);

      if (window.L) {
        const fallback = document.getElementById('map-fallback');
        if (fallback) fallback.hidden = true;

        const map = L.map('map', { zoomControl: true }).setView([lat, lng], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap contributors',
        }).addTo(map);

        L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(map);
        L.circle([lat, lng], {
          radius: 85,
          color: '#1d5fd1',
          weight: 1,
          fillColor: '#76a7f5',
          fillOpacity: 0.12,
        }).addTo(map);

        const vehicleIcon = L.divIcon({
          className: 'vehicle-map-icon',
          html: `<div class="vehicle-marker" style="--heading:${safeHeading}deg"><span class="heading-arrow"></span><span class="vehicle-dot">车</span></div>`,
          iconSize: [42, 42],
          iconAnchor: [21, 21],
        });
        const marker = L.marker([lat, lng], { icon: vehicleIcon, zIndexOffset: 1000 }).addTo(map);

        const popup = document.createElement('div');
        const popupTitle = document.createElement('div');
        const popupPoi = document.createElement('div');
        const popupMotion = document.createElement('div');
        popupTitle.className = 'popup-title';
        popupPoi.className = 'popup-line';
        popupMotion.className = 'popup-line';
        popupTitle.textContent = plate;
        popupPoi.textContent = poi;
        popupMotion.textContent = `${direction} · ${speed}`;
        popup.append(popupTitle, popupPoi, popupMotion);
        marker.bindPopup(popup);
      }
    </script>
  </body>
</html>
